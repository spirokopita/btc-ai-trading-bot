services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable_freqai
    restart: unless-stopped
    container_name: btc-aud-v3-freqtrade
    environment:
      PYTHONPATH: /freqtrade/user_data/strategies:/opt/bot
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./trading_costs:/opt/bot/trading_costs:ro
      - ./config:/opt/bot/config:ro
    ports:
      - '127.0.0.1:8080:8080'
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --freqaimodel LightGBMRegressor
      --strategy BtcAudEdgeV3
    security_opt:
      - no-new-privileges:true

  risk-guard:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - freqtrade
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./guard:/opt/guard:ro
    command: python /opt/guard/watchdog.py
    security_opt:
      - no-new-privileges:true
